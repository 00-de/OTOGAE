<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>DayDream Beats!! ONLINE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;

touch-action:none;
overscroll-behavior:none;
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

background:
linear-gradient(
to bottom,
#58c6ff,
#001d3d
);

color:white;
}

/* 背景 */
.bg{
position:absolute;
width:100%;
height:100%;

background:
url('bg.jpg')
center/cover;

opacity:0.35;
}

/* 上UI */
.top-ui{
position:absolute;

top:15px;
left:0;

width:100%;

padding:0 15px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:100;
}

.song-title{

font-size:18px;
font-weight:bold;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

max-width:60%;

text-shadow:
0 0 10px black;
}

.score{
font-size:18px;
font-weight:bold;
}

/* ボタン */
.controls{

position:absolute;

top:60px;
left:50%;

transform:translateX(-50%);

display:flex;
flex-wrap:wrap;

justify-content:center;

gap:8px;

width:95%;

z-index:100;
}

.control-btn{

padding:8px 14px;

border:none;
border-radius:12px;

background:white;
color:#222;

font-size:13px;
font-weight:bold;

box-shadow:
0 0 10px white;
}

/* 難易度 */
.mode-area{

position:absolute;

top:120px;
left:50%;

transform:translateX(-50%);

display:flex;
flex-wrap:wrap;

justify-content:center;

gap:8px;

width:95%;

z-index:100;
}

.mode-btn{

padding:8px 14px;

border:none;
border-radius:12px;

background:#ffffffcc;

font-size:13px;
font-weight:bold;
}

/* コンボ */
#combo{
position:absolute;

top:180px;
left:50%;

transform:translateX(-50%);

font-size:50px;
font-weight:bold;

z-index:100;

text-shadow:
0 0 20px white;
}

/* 判定 */
#judge{
position:absolute;

top:245px;
left:50%;

transform:translateX(-50%);

font-size:32px;
font-weight:bold;

z-index:100;

text-shadow:
0 0 15px white;
}

/* ランキング */
#ranking{

position:absolute;

right:10px;
top:320px;

width:170px;

background:
rgba(0,0,0,0.6);

padding:12px;

border-radius:15px;

font-size:12px;

z-index:200;

line-height:1.6;
}

/* レーン */
.lanes{
position:absolute;

bottom:0;
left:50%;

transform:translateX(-50%);

width:95%;
max-width:520px;

height:100%;

display:flex;
}

.lane{
flex:1;
position:relative;

border-left:
2px solid rgba(255,255,255,0.15);

border-right:
2px solid rgba(255,255,255,0.15);
}

/* 判定ライン */
.hit-line{
position:absolute;

bottom:140px;

width:100%;
height:7px;

background:white;

box-shadow:
0 0 20px white,
0 0 40px white;
}

/* ノーツ */
.note{
position:absolute;

width:80%;
height:24px;

left:10%;

border-radius:15px;

background:
linear-gradient(
90deg,
#ffffff,
#8ce8ff
);

box-shadow:
0 0 15px #8ce8ff,
0 0 35px #8ce8ff;
}

/* タップ演出 */
.tap-effect{
position:absolute;

bottom:120px;

width:100%;
height:50px;

background:
rgba(255,255,255,0.5);

animation:flash 0.25s;
}

@keyframes flash{

0%{
opacity:1;
transform:scaleY(1);
}

100%{
opacity:0;
transform:scaleY(2);
}

}

/* スタート */
.start-menu{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

display:flex;
flex-direction:column;

gap:15px;

z-index:300;
}

.menu-btn{

padding:20px 35px;

font-size:24px;
font-weight:bold;

border:none;
border-radius:20px;

background:white;
color:#333;

box-shadow:
0 0 25px white;
}

/* フルコン */
#fullcombo{
position:absolute;

top:45%;
left:50%;

transform:
translate(-50%,-50%);

font-size:42px;
font-weight:bold;

color:gold;

display:none;

z-index:300;

text-shadow:
0 0 25px gold,
0 0 50px gold;
}

</style>
</head>

<body>

<div id="game">

<div class="bg"></div>

<!-- 上UI -->
<div class="top-ui">

<div class="song-title">
🎵 風になる合図 / 蓮
</div>

<div class="score"
id="score">
Score : 0
</div>

</div>

<!-- ボタン -->
<div class="controls">

<button class="control-btn"
onclick="pauseGame()">
⏸ 一時停止
</button>

<button class="control-btn"
onclick="resetScore()">
🔄 リセット
</button>

</div>

<!-- 難易度 -->
<div class="mode-area">

<button class="mode-btn"
onclick="setEasyMode()">
🌟 初級
</button>

<button class="mode-btn"
onclick="setHardMode()">
🔥 上級
</button>

</div>

<!-- コンボ -->
<div id="combo">
0
</div>

<!-- 判定 -->
<div id="judge">
READY
</div>

<!-- ランキング -->
<div id="ranking">
🏆 LOADING...
</div>

<!-- フルコン -->
<div id="fullcombo">
🌟 FULL COMBO 🌟
</div>

<!-- スタート -->
<div class="start-menu">

<button class="menu-btn"
onclick="restartGame()">
▶ 再生してスタート
</button>

</div>

<!-- レーン -->
<div class="lanes">

<div class="lane" data-lane="0">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="1">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="2">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="3">
<div class="hit-line"></div>
</div>

</div>

</div>

<!-- 音楽 -->
<audio id="music"
src="kaze.mp3">
</audio>

<!-- Firebase -->
<script type="module">

import {
initializeApp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
limit
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase設定 */
const firebaseConfig = {

/* Firebaseから貼る */

apiKey:"ここ",

authDomain:"ここ",

projectId:"ここ",

storageBucket:"ここ",

messagingSenderId:"ここ",

appId:"ここ"

};

/* 初期化 */
const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.db = db;
window.collection = collection;
window.addDoc = addDoc;
window.getDocs = getDocs;
window.query = query;
window.orderBy = orderBy;
window.limit = limit;

</script>

<script>

/* 音 */
const music =
document.getElementById("music");

/* UI */
const comboText =
document.getElementById("combo");

const judgeText =
document.getElementById("judge");

const scoreText =
document.getElementById("score");

const fullcombo =
document.getElementById("fullcombo");

/* レーン */
const lanes =
document.querySelectorAll(".lane");

/* 状態 */
let combo = 0;
let score = 0;
let miss = 0;

let started = false;
let paused = false;

/* 難易度 */
let noteSpeed = 3;
let noteInterval = 450;

/* ノーツ */
let notes = [];

/* 譜面生成 */
function generateNotes(){

notes = [];

const songLength =
music.duration * 1000;

for(
let i = 1000;
i < songLength;
i += noteInterval
){

notes.push({

time:i,

lane:
Math.floor(
Math.random() * 4
)

});

}

}

/* 再スタート */
function restartGame(){

music.pause();

music.currentTime = 0;

/* ノーツ削除 */
document.querySelectorAll(".note")
.forEach(note=>{

clearInterval(note.move);

note.remove();

});

/* リセット */
score = 0;
combo = 0;
miss = 0;

scoreText.innerText =
"Score : 0";

comboText.innerText =
"0";

judgeText.innerText =
"START!! 🎵";

fullcombo.style.display =
"none";

started = false;
paused = false;

startGame();

}

/* 開始 */
function startGame(){

started = true;

document.querySelector(
".start-menu"
).style.display = "none";

generateNotes();

music.play();

gameLoop();

loadRanking();

}

/* ループ */
function gameLoop(){

if(paused) return;

const currentTime =
music.currentTime * 1000;

notes.forEach(note=>{

if(
!note.spawned &&
currentTime >= note.time - 2200
){

createNote(note);

note.spawned = true;

}

});

if(!music.paused){

requestAnimationFrame(
gameLoop
);

}

}

/* ノーツ */
function createNote(noteData){

const lane =
lanes[noteData.lane];

const note =
document.createElement("div");

note.classList.add("note");

lane.appendChild(note);

let pos = -30;

const move = setInterval(()=>{

if(paused) return;

pos += noteSpeed;

note.style.top =
pos + "px";

if(pos >= window.innerHeight){

miss++;

combo = 0;

comboText.innerText =
combo;

judgeText.innerText =
"MISS ❌";

note.remove();

clearInterval(move);

}

},16);

note.move = move;

}

/* 判定 */
function hitNote(laneIndex){

if(paused) return;

const lane =
lanes[laneIndex];

const laneNotes =
lane.querySelectorAll(".note");

if(laneNotes.length === 0){

combo = 0;

comboText.innerText =
combo;

judgeText.innerText =
"MISS ❌";

return;

}

const note =
laneNotes[0];

const rect =
note.getBoundingClientRect();

const hitY =
window.innerHeight - 170;

const diff =
Math.abs(
rect.top - hitY
);

let addScore = 0;

if(diff < 60){

judgeText.innerText =
"PERFECT ✨";

addScore = 300;

}else if(diff < 100){

judgeText.innerText =
"GREAT 🔥";

addScore = 200;

}else if(diff < 140){

judgeText.innerText =
"GOOD 👍";

addScore = 100;

}else{

judgeText.innerText =
"MISS ❌";

combo = 0;

comboText.innerText =
combo;

return;

}

/* コンボ倍率 */
let comboBonus = 1;

if(combo >= 50){

comboBonus = 5;

}else if(combo >= 30){

comboBonus = 3;

}else if(combo >= 10){

comboBonus = 2;

}

score +=
addScore * comboBonus;

combo++;

comboText.innerText =
combo;

scoreText.innerText =
"Score : " + score;

clearInterval(note.move);

note.remove();

tapEffect(lane);

}

/* エフェクト */
function tapEffect(lane){

const effect =
document.createElement("div");

effect.classList.add(
"tap-effect"
);

lane.appendChild(effect);

setTimeout(()=>{

effect.remove();

},250);

}

/* 一時停止 */
function pauseGame(){

if(!started) return;

if(!paused){

music.pause();

paused = true;

judgeText.innerText =
"⏸ PAUSE";

}else{

music.play();

paused = false;

gameLoop();

judgeText.innerText =
"▶ RESUME";

}

}

/* リセット */
function resetScore(){

score = 0;
combo = 0;
miss = 0;

scoreText.innerText =
"Score : 0";

comboText.innerText =
"0";

}

/* 初級 */
function setEasyMode(){

noteSpeed = 2;
noteInterval = 650;

restartGame();

}

/* 上級 */
function setHardMode(){

noteSpeed = 5;
noteInterval = 300;

restartGame();

}

/* タップ */
lanes.forEach(
(lane,index)=>{

lane.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

hitNote(index);

},
{ passive:false }
);

}
);

/* キーボード */
document.addEventListener(
"keydown",
(e)=>{

if(e.key==="d") hitNote(0);
if(e.key==="f") hitNote(1);
if(e.key==="j") hitNote(2);
if(e.key==="k") hitNote(3);

}
);

/* スコア保存 */
async function saveScore(){

const playerName =
prompt("名前を入力✨");

if(!playerName) return;

await addDoc(
collection(db,"scores"),
{

name:playerName,

score:score,

combo:combo,

mode:
noteSpeed >= 5
? "HARD"
: "EASY",

date:
new Date().toLocaleDateString()

}
);

loadRanking();

}

/* ランキング */
async function loadRanking(){

const q =
query(
collection(db,"scores"),
orderBy("score","desc"),
limit(5)
);

const snapshot =
await getDocs(q);

let html =
"🏆 TODAY BEST<br><br>";

snapshot.forEach(doc=>{

const data = doc.data();

html +=
`
${data.name}<br>
${data.score}<br><br>
`;

});

document.getElementById(
"ranking"
).innerHTML = html;

}

/* 曲終了 */
music.addEventListener(
"ended",
()=>{

judgeText.innerText =
"🎉 LIVE CLEAR 🎉";

if(miss === 0){

fullcombo.style.display =
"block";

}

saveScore();

}
);

</script>

</body>
</html>
