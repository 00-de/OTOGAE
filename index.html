<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DayDream Beats!! - 風になる合図</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
overflow:hidden;
background:black;
color:white;
touch-action:none;
}

/* ゲーム全体 */
#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:
linear-gradient(
to bottom,
#5bbcff,
#001b33
);
}

/* 背景 */
.bg{
position:absolute;
width:100%;
height:100%;
background:
url('bg.jpg')
center/cover;
opacity:0.35;
}

/* 上UI */
.top-ui{
position:absolute;
top:20px;
left:0;
width:100%;
padding:0 20px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:20;
}

.song-title{
font-size:22px;
font-weight:bold;
text-shadow:0 0 10px black;
}

.score{
font-size:22px;
font-weight:bold;
}

/* コンボ */
#combo{
position:absolute;
top:90px;
left:50%;
transform:translateX(-50%);
font-size:52px;
font-weight:bold;
text-shadow:
0 0 20px white;
z-index:30;
}

/* 判定 */
#judge{
position:absolute;
top:160px;
left:50%;
transform:translateX(-50%);
font-size:38px;
font-weight:bold;
z-index:30;
text-shadow:0 0 15px white;
}

/* レーン */
.lanes{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:95%;
max-width:520px;
height:100%;
display:flex;
z-index:10;
}

.lane{
flex:1;
position:relative;
border-left:
2px solid rgba(255,255,255,0.15);
border-right:
2px solid rgba(255,255,255,0.15);
}

/* 判定ライン */
.hit-line{
position:absolute;
bottom:120px;
width:100%;
height:7px;
background:white;
box-shadow:
0 0 20px white,
0 0 40px white;
z-index:5;
}

/* ノーツ */
.note{
position:absolute;
width:80%;
height:22px;
left:10%;
border-radius:14px;

background:
linear-gradient(
90deg,
#ffffff,
#8ee7ff
);

box-shadow:
0 0 15px #8ee7ff,
0 0 35px #8ee7ff;

}

/* タップエフェクト */
.tap-effect{
position:absolute;
bottom:100px;
width:100%;
height:50px;
background:
rgba(255,255,255,0.5);

animation:flash 0.25s;
}

@keyframes flash{
0%{
opacity:1;
transform:scaleY(1);
}
100%{
opacity:0;
transform:scaleY(2);
}
}

/* スタートボタン */
.start-btn{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:22px 45px;
font-size:28px;
font-weight:bold;
border:none;
border-radius:20px;
background:white;
color:#333;
z-index:50;
box-shadow:
0 0 25px white;
}

/* フルコン */
#fullcombo{
position:absolute;
top:45%;
left:50%;
transform:translate(-50%,-50%);
font-size:58px;
font-weight:bold;
color:gold;
display:none;
z-index:100;
text-shadow:
0 0 25px gold,
0 0 50px gold;

animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:translate(-50%,-50%) scale(1);
}

50%{
transform:translate(-50%,-50%) scale(1.1);
}

100%{
transform:translate(-50%,-50%) scale(1);
}

}

</style>
</head>

<body>

<div id="game">

<div class="bg"></div>

<div class="top-ui">

<div class="song-title">
🎵 風になる合図 
</div>

<div class="score" id="score">
0
</div>

</div>

<div id="combo">
0
</div>

<div id="judge">
READY
</div>

<div id="fullcombo">
🌟 FULL COMBO 🌟
</div>

<button class="start-btn" onclick="startGame()">
START LIVE
</button>

<div class="lanes">

<div class="lane" data-lane="0">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="1">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="2">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="3">
<div class="hit-line"></div>
</div>

</div>

</div>

<!-- 音楽 -->
<audio id="music" src="kaze.mp3"></audio>

<script>

const music =
document.getElementById("music");

const lanes =
document.querySelectorAll(".lane");

const comboText =
document.getElementById("combo");

const judgeText =
document.getElementById("judge");

const scoreText =
document.getElementById("score");

const fullcombo =
document.getElementById("fullcombo");

let combo = 0;
let score = 0;
let miss = 0;

/* 譜面データ */
const notes = [

{time:1000,lane:0},
{time:1500,lane:1},
{time:2000,lane:2},
{time:2500,lane:3},

{time:3200,lane:1},
{time:3600,lane:2},
{time:4000,lane:0},
{time:4500,lane:3},

{time:5200,lane:0},
{time:5600,lane:1},
{time:6000,lane:2},
{time:6500,lane:3},

{time:7200,lane:2},
{time:7600,lane:1},
{time:8000,lane:0},
{time:8500,lane:3},

{time:9200,lane:1},
{time:9600,lane:2},
{time:10000,lane:3},
{time:10400,lane:0},

];

let started = false;

/* ゲーム開始 */
function startGame(){

if(started) return;

started = true;

document.querySelector(".start-btn")
.style.display = "none";

music.play();

gameLoop();

}

/* ゲームループ */
function gameLoop(){

const currentTime =
music.currentTime * 1000;

notes.forEach(note=>{

if(
!note.spawned &&
currentTime >= note.time - 2000
){

createNote(note);

note.spawned = true;

}

});

requestAnimationFrame(gameLoop);

}

/* ノーツ生成 */
function createNote(noteData){

const lane =
lanes[noteData.lane];

const note =
document.createElement("div");

note.classList.add("note");

note.dataset.hit = "false";

note.style.top = "-30px";

lane.appendChild(note);

const speed = 4;

let pos = -30;

const move = setInterval(()=>{

pos += speed;

note.style.top = pos + "px";

if(pos >=
window.innerHeight - 160){

if(note.dataset.hit === "false"){

miss++;
combo = 0;

comboText.innerText = combo;

judgeText.innerText = "MISS";

}

note.remove();

clearInterval(move);

}

},16);

note.move = move;

}

/* タップ処理 */
function hitNote(laneIndex){

const lane =
lanes[laneIndex];

const notes =
lane.querySelectorAll(".note");

if(notes.length === 0){

judgeText.innerText = "MISS";
combo = 0;

comboText.innerText = combo;

return;

}

const note = notes[0];

const rect =
note.getBoundingClientRect();

const hitY =
window.innerHeight - 160;

const diff =
Math.abs(rect.top - hitY);

if(diff < 80){

note.dataset.hit = "true";

clearInterval(note.move);

note.remove();

combo++;

score += 100;

comboText.innerText = combo;

scoreText.innerText =
"Score : " + score;

judgeText.innerText =
"PERFECT ✨";

tapEffect(lane);

if(combo % 10 === 0){

judgeText.innerText =
combo + " COMBO 🔥";

}

}else{

judgeText.innerText = "BAD";

combo = 0;

comboText.innerText = combo;

}

}

/* タップエフェクト */
function tapEffect(lane){

const effect =
document.createElement("div");

effect.classList.add("tap-effect");

lane.appendChild(effect);

setTimeout(()=>{

effect.remove();

},250);

}

/* タッチ操作 */
lanes.forEach((lane,index)=>{

lane.addEventListener(
"touchstart",
()=>{
hitNote(index);
}
);

});

/* PCキー操作 */
document.addEventListener(
"keydown",
(e)=>{

if(e.key === "d"){
hitNote(0);
}

if(e.key === "f"){
hitNote(1);
}

if(e.key === "j"){
hitNote(2);
}

if(e.key === "k"){
hitNote(3);
}

}
);

/* 曲終了 */
music.addEventListener(
"ended",
()=>{

if(miss === 0){

fullcombo.style.display = "block";

}

judgeText.innerText =
"🎉 LIVE CLEAR 🎉";

}
);

</script>

</body>
</html>
