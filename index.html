<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>DayDream Beats!!</title>

<!-- PWA: ホーム画面から全画面起動 -->
<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="apple-mobile-web-app-title"
content="DayDream Beats">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="theme-color"
content="#001d3d">

<link rel="manifest"
href="manifest.json">

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;

touch-action:none;
overscroll-behavior:none;
}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

background:
linear-gradient(
to bottom,
#58c6ff,
#001d3d
);

color:white;
}

/* 背景 */
.bg{
position:absolute;
width:100%;
height:100%;

background:
url('bg.jpg')
center/cover;

opacity:0.35;
}

/* 上UI */
.top-ui{
position:absolute;

top:15px;
left:0;

width:100%;

padding:0 55px 0 15px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:100;
}

.song-title{

font-size:18px;
font-weight:bold;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

max-width:60%;

text-shadow:
0 0 10px black;
}

.score{
font-size:18px;
font-weight:bold;
}

/* ボタン（プレイ中は左下に表示） */
.controls{

position:absolute;

/* デフォルト位置（スタート前） */
top:60px;
left:50%;

transform:translateX(-50%);

display:flex;
flex-wrap:wrap;

justify-content:center;

gap:8px;

width:95%;

z-index:100;

transition: all 0.3s ease;
}

/* プレイ中は判定ラインの左下 */
.controls.playing{
top: auto;
bottom: 60px;
left: 10px;
transform: none;
width: auto;
flex-direction: column;
gap: 6px;
}

.control-btn{

padding:8px 14px;

border:none;
border-radius:12px;

background:white;
color:#222;

font-size:13px;
font-weight:bold;

box-shadow:
0 0 10px white;
}

/* プレイ中は小さく */
.controls.playing .control-btn{
padding: 7px 12px;
font-size: 12px;
opacity: 0.85;
box-shadow: 0 0 8px white;
}

/* 難易度 */
.mode-area{

position:absolute;

top:120px;
left:50%;

transform:translateX(-50%);

display:flex;
flex-wrap:wrap;

justify-content:center;

gap:8px;

width:95%;

z-index:100;

transition: opacity 0.3s ease, visibility 0.3s ease;
}

/* プレイ中は非表示 */
.mode-area.hidden{
opacity: 0;
visibility: hidden;
pointer-events: none;
}

.mode-btn{

padding:8px 14px;

border:none;
border-radius:12px;

background:#ffffffcc;

font-size:13px;
font-weight:bold;
}

/* コンボ：判定ラインの下に配置 */
#combo{
position:absolute;

bottom: 82px;
left:50%;

transform:translateX(-50%);

font-size:36px;
font-weight:bold;

z-index:100;

text-shadow:
0 0 20px white;
}

/* 判定：判定ラインの右下に小さく */
#judge{
position:absolute;

bottom: 90px;
right: 15px;

font-size:15px;
font-weight:bold;

z-index:100;

text-align:right;

text-shadow:
0 0 8px currentColor;

opacity: 0.9;

transition: color 0.1s ease;
}

/* レーン */
.lanes{
position:absolute;

bottom:0;
left:50%;

transform:translateX(-50%);

width:95%;
max-width:520px;

height:100%;

display:flex;
}

/* レーン */
.lane{
flex:1;
position:relative;

border-left:
2px solid rgba(255,255,255,0.15);

border-right:
2px solid rgba(255,255,255,0.15);
}

/* 判定ライン */
.hit-line{
position:absolute;

bottom:130px;

width:100%;
height:10px;

background:white;

box-shadow:
0 0 20px white,
0 0 40px white;
}

/* ノーツ */
.note{
position:absolute;

width:80%;
height:24px;

left:10%;

border-radius:15px;

background:
linear-gradient(
90deg,
#ffffff,
#8ce8ff
);

box-shadow:
0 0 15px #8ce8ff,
0 0 35px #8ce8ff;
}

/* タップ演出 */
.tap-effect{
position:absolute;

bottom:110px;

width:100%;
height:60px;

background:
rgba(255,255,255,0.5);

animation:flash 0.25s;
}

@keyframes flash{

0%{
opacity:1;
transform:scaleY(1);
}

100%{
opacity:0;
transform:scaleY(2);
}

}

/* 曲選択メニュー */
.song-select-title{
font-size:16px;
font-weight:bold;
letter-spacing:3px;
color:#aee8ff;
text-shadow:0 0 10px #aee8ff;
margin-bottom:4px;
text-align:center;
}

.song-list{
display:flex;
flex-direction:column;
gap:10px;
width:100%;
}

.song-btn{
padding:14px 20px;
border:none;
border-radius:16px;
background:rgba(255,255,255,0.15);
color:white;
font-size:15px;
font-weight:bold;
text-align:left;
box-shadow:0 0 12px rgba(140,232,255,0.3);
border:1px solid rgba(140,232,255,0.3);
line-height:1.5;
}

.song-btn:active{
background:rgba(255,255,255,0.35);
}

.song-btn .song-btn-title{
font-size:16px;
display:block;
}

.song-btn .song-btn-artist{
font-size:12px;
color:#aee8ff;
display:block;
}

.song-btn.selected{
background:rgba(140,232,255,0.3);
box-shadow:0 0 20px rgba(140,232,255,0.6);
border-color:#8ce8ff;
}

/* スタート画面 */
.start-menu{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

display:flex;
flex-direction:column;

gap:15px;

z-index:300;
}

/* スタートボタン */
.menu-btn{

padding:20px 35px;

font-size:24px;
font-weight:bold;

border:none;
border-radius:20px;

background:white;
color:#333;

box-shadow:
0 0 25px white;
}

/* フルコン */
#fullcombo{
position:absolute;

top:45%;
left:50%;

transform:
translate(-50%,-50%);

font-size:42px;
font-weight:bold;

color:gold;

display:none;

z-index:300;

text-shadow:
0 0 25px gold,
0 0 50px gold;

animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:
translate(-50%,-50%)
scale(1);
}

50%{
transform:
translate(-50%,-50%)
scale(1.1);
}

100%{
transform:
translate(-50%,-50%)
scale(1);
}

}

/* 全画面ボタン */
#fullscreen-btn{
position:absolute;
top: 15px;
right: 15px;
z-index: 500;
padding: 6px 10px;
border: none;
border-radius: 10px;
background: rgba(255,255,255,0.25);
color: white;
font-size: 18px;
cursor: pointer;
backdrop-filter: blur(4px);
box-shadow: 0 0 8px rgba(255,255,255,0.3);
}
/* 成功率オーバーレイ */
#accuracy-overlay{
position:absolute;
top:0;left:0;
width:100%;height:100%;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
gap:10px;
z-index:350;
background:rgba(0,10,40,0.75);
backdrop-filter:blur(4px);
}
#accuracy-label{
font-size:16px;
font-weight:bold;
letter-spacing:4px;
color:#aee8ff;
opacity:0;
transition:opacity 0.6s ease;
}
#accuracy-number{
font-size:88px;
font-weight:bold;
color:white;
text-shadow:
0 0 30px #8ce8ff,
0 0 60px #8ce8ff;
opacity:0;
transform:scale(0.6);
transition:
opacity 0.6s ease,
transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
}
#accuracy-sub{
font-size:18px;
font-weight:bold;
color:gold;
text-shadow:0 0 16px gold;
opacity:0;
transition:opacity 0.6s ease 0.4s;
min-height:28px;
text-align:center;
}
#accuracy-overlay.show #accuracy-label,
#accuracy-overlay.show #accuracy-number,
#accuracy-overlay.show #accuracy-sub{
opacity:1;
}
#accuracy-overlay.show #accuracy-number{
transform:scale(1);
}

#result-screen{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;

display:none;
flex-direction:column;
align-items:center;
justify-content:center;

padding: 20px 16px;
box-sizing: border-box;
overflow-y: auto;

gap:12px;

z-index:400;

background:
linear-gradient(
160deg,
rgba(0,30,80,0.92),
rgba(0,80,140,0.92)
);

backdrop-filter: blur(6px);
}

.result-title{
font-size:26px;
font-weight:bold;
letter-spacing:3px;
text-align:center;
white-space:nowrap;
text-shadow:
0 0 20px #8ce8ff,
0 0 40px #8ce8ff;
animation: resultPulse 1.2s ease-in-out infinite;
}

@keyframes resultPulse{
0%{ transform:scale(1); }
50%{ transform:scale(1.04); }
100%{ transform:scale(1); }
}

.result-divider{
width:80%;
max-width:260px;
height:2px;
background:
linear-gradient(
90deg,
transparent,
#8ce8ff,
transparent
);
}

.result-rows{
display:flex;
flex-direction:column;
gap:8px;
width:100%;
max-width:280px;
}

.result-row{
display:flex;
justify-content:space-between;
align-items:center;
font-size:16px;
font-weight:bold;
}

.result-label{
color:#aee8ff;
font-size:13px;
}

.result-value{
font-size:18px;
text-shadow: 0 0 10px white;
}

#result-fullcombo-badge{
display:none;
font-size:22px;
font-weight:bold;
color:gold;
text-align:center;
text-shadow:
0 0 20px gold,
0 0 40px gold;
animation:pulse 1s infinite;
}

.result-btn{
padding:12px 28px;
font-size:16px;
font-weight:bold;
border:none;
border-radius:18px;
background:white;
color:#333;
box-shadow: 0 0 20px white;
}

/* 進行バー */
#progress-bar-wrap{
position:absolute;
top:48px;
left:0;
width:100%;
z-index:100;
display:none;
flex-direction:column;
align-items:flex-end;
padding:0 10px;
gap:2px;
}

#progress-bar{
width:100%;
height:5px;
border-radius:4px;
background:rgba(255,255,255,0.2);
}

#progress-time{
font-size:11px;
color:rgba(255,255,255,0.7);
font-weight:bold;
}

/* ランキングモーダル */
#ranking-modal{
position:absolute;
top:0;left:0;
width:100%;height:100%;
display:none;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:450;
background:rgba(0,10,40,0.93);
backdrop-filter:blur(6px);
padding:24px 16px;
box-sizing:border-box;
overflow-y:auto;
gap:12px;
}

.ranking-title{
font-size:20px;
font-weight:bold;
color:#8ce8ff;
text-shadow:0 0 15px #8ce8ff;
letter-spacing:3px;
text-align:center;
}

.ranking-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:6px 10px;
border-radius:10px;
width:100%;
max-width:320px;
}

</style>
</head>

<body>

<div class="bg"></div>

<script>

/* 全画面 */
function toggleFullscreen(){

const btn =
document.getElementById(
"fullscreen-btn"
);

if(!document.fullscreenElement){

document.documentElement
.requestFullscreen()
.catch(err=>{
console.log(err);
});

btn.innerText = "✕";

}else{

document.exitFullscreen();

btn.innerText = "⛶";

}

}

document.addEventListener(
"fullscreenchange",
()=>{

const btn =
document.getElementById(
"fullscreen-btn"
);

if(!document.fullscreenElement){
btn.innerText = "⛶";
}else{
btn.innerText = "✕";
}

}
);

/* スコア表示フォーマット（カンマ区切り・小数2桁） */
function formatScore(val){
const fixed = val.toFixed(2);
const parts = fixed.split(".");
parts[0] = parts[0].replace(
/\B(?=(\d{3})+(?!\d))/g, ","
);
return parts.join(".");
}

/* SE再生 */
function playSE(id){
const el = document.getElementById(id);
if(!el) return;
el.currentTime = 0;
el.play().catch(()=>{});
}

/* iOS音声アンロック */
let audioUnlocked = false;

function unlockAudio(){
if(audioUnlocked) return;
audioUnlocked = true;

/* ノーツ生成 */
function createNote(noteData){

const lane =
lanes[noteData.lane];

const note =
document.createElement("div");

note.classList.add("note");

note.dataset.hit = "false";

lane.appendChild(note);

let pos = -30;

const move = setInterval(()=>{

if(paused) return;

pos += noteSpeed;

note.style.top =
pos + "px";

if(pos >= window.innerHeight){

if(
note.dataset.hit === "false"
){

miss++;

combo = 0;

comboText.innerText =
combo;

judgeText.style.color = "#ff6060";
judgeText.innerText =
"MISS ❌";
playSE("se-miss");
const deduct = 300;
totalDeduct += deduct;
score = Math.max(0, score - deduct);
scoreText.innerText =
"Score : " + formatScore(score);

exStreak = 0; pfStreak = 0;
grStreak = 0; gdStreak = 0;

}

note.remove();

clearInterval(move);

}

},16);

note.move = move;

}

/* 判定 */
function hitNote(laneIndex){

if(paused) return;

const lane =
lanes[laneIndex];

const laneNotes =
lane.querySelectorAll(".note");

if(laneNotes.length === 0){

/* 空タップ → MISSカウント・コンボリセット・-200点 */
miss++;
combo = 0;
comboText.innerText = combo;
judgeText.style.color = "#ff6060";
judgeText.innerText = "MISS ❌";
playSE("se-miss");

exStreak = 0; pfStreak = 0;
grStreak = 0; gdStreak = 0;

const deduct = 200;
totalDeduct += deduct;
score = Math.max(0, score - deduct);
scoreText.innerText =
"Score : " + formatScore(score);

return;

}

const note =
laneNotes[0];

const rect =
note.getBoundingClientRect();

const hitY =
window.innerHeight - 155;

/* 符号付きdiff：マイナス=早め、プラス=遅め */
const signedDiff =
rect.top - hitY;

const diff =
Math.abs(signedDiff);

const timing =
signedDiff < 0 ? " ⏩EARLY" : " ⏪LATE";

let addScore = 0;

/* EXCELLENT（最高精度：diff < 40） */
if(diff < 40){

judgeText.style.color = "#ff44ff";
judgeText.innerText = "EXCELLENT ☆彡";

/* タップ位置ボーナス：10点単位 */
const posBonus =
Math.round((1 - diff / 40) * 10) * 10;

addScore = 1000 + posBonus;

/* ストリーク */
exStreak++;
pfStreak = 0; grStreak = 0; gdStreak = 0;

let streakBonus = 0;
if(exStreak % 15 === 0){
streakBonus = 25000;
judgeText.innerText =
"⭐ EXCELLENT " + exStreak +
" STREAK! +" + streakBonus;
}

addScore += streakBonus;

/* PERFECT */
}else if(diff < 100){

judgeText.style.color = "#ffe066";
judgeText.innerText = "PERFECT ✨";

const posBonus =
Math.round((1 - (diff - 40) / 60) * 10) * 10;

addScore = 500 + posBonus;

exStreak = 0;
pfStreak++;
grStreak = 0; gdStreak = 0;

let streakBonus = 0;
if(pfStreak % 10 === 0){
streakBonus = 10000;
judgeText.innerText =
"✨ PERFECT " + pfStreak +
" STREAK! +" + streakBonus;
}

addScore += streakBonus;

/* GREAT */
}else if(diff < 160){

judgeText.style.color = "#66dfff";
judgeText.innerText = "GREAT 🔥" + timing;

const posBonus =
Math.round((1 - (diff - 100) / 60) * 10) * 10;

addScore = 200 + posBonus;

exStreak = 0; pfStreak = 0;
grStreak++;
gdStreak = 0;

let streakBonus = 0;
if(grStreak % 10 === 0){
streakBonus = 5000;
judgeText.innerText =
"🔥 GREAT " + grStreak +
" STREAK! +" + streakBonus;
}

addScore += streakBonus;

/* GOOD */
}else if(diff < 220){

judgeText.style.color = "#a0ff88";
judgeText.innerText = "GOOD 👍" + timing;

const posBonus =
Math.round((1 - (diff - 160) / 60) * 10) * 10;

addScore = 100 + posBonus;

exStreak = 0; pfStreak = 0; grStreak = 0;
gdStreak++;

let streakBonus = 0;
if(gdStreak % 10 === 0){
streakBonus = 2000;
judgeText.innerText =
"👍 GOOD " + gdStreak +
" STREAK! +" + streakBonus;
}

addScore += streakBonus;

/* MISS */
}else{

judgeText.style.color = "#ff6060";
judgeText.innerText = "MISS ❌";
playSE("se-miss");

miss++;
combo = 0;
comboText.innerText = combo;

/* ストリーク全リセット */
exStreak = 0; pfStreak = 0;
grStreak = 0; gdStreak = 0;

/* タイミングミス減点 -300 */
const deduct = 300;
totalDeduct += deduct;
score = Math.max(0, score - deduct);
scoreText.innerText =
"Score : " + formatScore(score);

return;

}

/* combo を先に増やしてから倍率計算 */
combo++;

if(combo > maxCombo){
maxCombo = combo;
}

/* コンボ倍率（固定定義） */
const COMBO_RATES = [
{ min: 101, bonus: 15  },
{ min:  51, bonus: 10  },
{ min:  32, bonus:  8  },
{ min:  12, bonus:  2.5},
{ min:   1, bonus:  2.0}
];

let comboBonus = 2.0;
for(const r of COMBO_RATES){
if(combo >= r.min){
comboBonus = r.bonus;
break;
}
}

/* スコア加算（小数2桁） */
score = Math.round(
(score + addScore * comboBonus) * 100
) / 100;

comboText.innerText = combo;

scoreText.innerText =
"Score : " + formatScore(score);

/* ノーツ削除 */
note.dataset.hit = "true";
hitNotes++;

clearInterval(note.move);

note.remove();

/* 演出 */
tapEffect(lane, judgeText.style.color);

/* コンボ演出 + SE + 画像 */
if(combo >= 200 && combo % 200 === 0){

playSE("se-combo100");
showComboImage(200);
judgeText.style.color = "#ff44ff";
judgeText.innerText = "🌟 " + combo + " COMBO 🌟";

}else if(combo === 150){

playSE("se-combo100");
showComboImage(150);
judgeText.style.color = "#ff44ff";
judgeText.innerText = "🌟 150 COMBO 🌟";

}else if(combo >= 100 && combo % 100 === 0){

playSE("se-combo100");
showComboImage(100);
judgeText.style.color = "#ff66cc";
judgeText.innerText = "🔥 AMAZING COMBO 🔥";

}else if(combo === 70){

playSE("se-combo70");
showComboImage(70);
judgeText.style.color = "#ff66cc";
judgeText.innerText = "70 COMBO 🔥";

}else if(combo === 50){

playSE("se-combo50");
showComboImage(50);
judgeText.style.color = "#ff66cc";
judgeText.innerText = "50 COMBO 🔥";

}else if(combo === 30){

playSE("se-combo30");
showComboImage(30);
judgeText.style.color = "#ffe066";
judgeText.innerText = "30 COMBO 🔥";

}else if(combo >= 50){

judgeText.style.color = "#ff66cc";
judgeText.innerText = "🔥 AMAZING COMBO 🔥";

}else if(combo % 10 === 0){

judgeText.style.color = "#ffe066";
judgeText.innerText = combo + " COMBO 🔥";

}

}

renderRanking(snap, listEl);
}catch(e){
listEl.innerHTML = "<div style='color:#ff6060;text-align:center;'>読み込み失敗</div>";
}
}

function closeRankingModal(){
document.getElementById("ranking-modal").style.display = "none";
}

/* リザルト画面ランキング読み込み */
async function loadRanking(){
const listEl = document.getElementById("result-ranking-list");
if(!listEl) return;
listEl.innerHTML = "<div style='color:rgba(255,255,255,0.5);text-align:center;'>読み込み中...</div>";
try{
const snap = await db.collection("scores")
.orderBy("score","desc").limit(10).get();
renderRanking(snap, listEl);
}catch(e){
listEl.innerHTML = "<div style='color:#ff6060;text-align:center;'>読み込み失敗</div>";
}
}

/* スコア送信 */
async function submitScore(){
const nameInput = document.getElementById("player-name-input");
const playerName = nameInput.value.trim() || "名無し";
const btn = document.getElementById("submit-score-btn");
const songTitle = (typeof SONGS!=="undefined" && SONGS[currentSong])
? SONGS[currentSong].title : "不明";

/* accuracy再計算 */
const baseDenom = Math.max(totalNotes, miss);
const acc = baseDenom > 0
? Math.max(0,Math.min(100,Math.round(
((baseDenom-miss)/baseDenom)*100)))
: 0;

try{
await db.collection("scores").add({
name: playerName,
score: score,
accuracy: acc,
song: songTitle,
maxCombo: maxCombo,
miss: miss,
createdAt: firebase.firestore.FieldValue.serverTimestamp()
});
btn.innerText = "✅ 登録しました！";
btn.disabled = true;
loadRanking();
}catch(e){
console.error(e);
alert("送信に失敗しました\n" + e.message);
}
}

</script>
