<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>DayDream Beats!!</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
overflow:hidden;
background:black;
touch-action:none;
}

/* 全体 */
#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

background:
linear-gradient(
to bottom,
#58c6ff,
#001d3d
);

color:white;
}

/* 背景 */
.bg{
position:absolute;
width:100%;
height:100%;

background:
url('bg.jpg')
center/cover;

opacity:0.35;
}

/* 上UI */
.top-ui{
position:absolute;
top:20px;
left:0;

width:100%;

padding:0 20px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:50;
}

/* 曲タイトル */
.song-title{
font-size:22px;
font-weight:bold;

text-shadow:
0 0 10px black;
}

/* スコア */
.score{
font-size:22px;
font-weight:bold;
}

/* コンボ */
#combo{
position:absolute;

top:90px;
left:50%;

transform:translateX(-50%);

font-size:52px;
font-weight:bold;

z-index:50;

text-shadow:
0 0 20px white;
}

/* 判定 */
#judge{
position:absolute;

top:160px;
left:50%;

transform:translateX(-50%);

font-size:38px;
font-weight:bold;

z-index:50;

text-shadow:
0 0 15px white;
}

/* レーン */
.lanes{
position:absolute;

bottom:0;
left:50%;

transform:translateX(-50%);

width:95%;
max-width:520px;

height:100%;

display:flex;

z-index:10;
}

/* レーン */
.lane{
flex:1;
position:relative;

border-left:
2px solid rgba(255,255,255,0.15);

border-right:
2px solid rgba(255,255,255,0.15);
}

/* 判定ライン */
.hit-line{
position:absolute;

bottom:140px;

width:100%;
height:7px;

background:white;

box-shadow:
0 0 20px white,
0 0 40px white;
}

/* ノーツ */
.note{
position:absolute;

width:80%;
height:24px;

left:10%;

border-radius:15px;

background:
linear-gradient(
90deg,
#ffffff,
#8ce8ff
);

box-shadow:
0 0 15px #8ce8ff,
0 0 35px #8ce8ff;
}

/* タップ演出 */
.tap-effect{
position:absolute;

bottom:120px;

width:100%;
height:50px;

background:
rgba(255,255,255,0.5);

animation:flash 0.25s;
}

@keyframes flash{

0%{
opacity:1;
transform:scaleY(1);
}

100%{
opacity:0;
transform:scaleY(2);
}

}

/* スタートボタン */
.start-btn{
position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

padding:22px 45px;

font-size:28px;
font-weight:bold;

border:none;
border-radius:20px;

background:white;
color:#333;

z-index:100;

box-shadow:
0 0 25px white;
}

/* フルコン */
#fullcombo{
position:absolute;

top:45%;
left:50%;

transform:
translate(-50%,-50%);

font-size:58px;
font-weight:bold;

color:gold;

display:none;

z-index:200;

text-shadow:
0 0 25px gold,
0 0 50px gold;

animation:pulse 1s infinite;
}

@keyframes pulse{

0%{
transform:
translate(-50%,-50%)
scale(1);
}

50%{
transform:
translate(-50%,-50%)
scale(1.1);
}

100%{
transform:
translate(-50%,-50%)
scale(1);
}

}

</style>
</head>

<body>

<div id="game">

<div class="bg"></div>

<!-- 上UI -->
<div class="top-ui">

<div class="song-title">
🎵 風になる合図 / 蓮
</div>

<div class="score"
id="score">
Score : 0
</div>

</div>

<!-- コンボ -->
<div id="combo">
0
</div>

<!-- 判定 -->
<div id="judge">
READY
</div>

<!-- フルコン -->
<div id="fullcombo">
🌟 FULL COMBO 🌟
</div>

<!-- スタート -->
<button class="start-btn"
onclick="startGame()">
START LIVE
</button>

<!-- レーン -->
<div class="lanes">

<div class="lane"
data-lane="0">
<div class="hit-line"></div>
</div>

<div class="lane"
data-lane="1">
<div class="hit-line"></div>
</div>

<div class="lane"
data-lane="2">
<div class="hit-line"></div>
</div>

<div class="lane"
data-lane="3">
<div class="hit-line"></div>
</div>

</div>

</div>

<!-- 音楽 -->
<audio id="music"
src="kaze.mp3">
</audio>

<script>

/* 音楽 */
const music =
document.getElementById("music");

/* UI */
const comboText =
document.getElementById("combo");

const judgeText =
document.getElementById("judge");

const scoreText =
document.getElementById("score");

const fullcombo =
document.getElementById("fullcombo");

/* レーン */
const lanes =
document.querySelectorAll(".lane");

/* スコア */
let combo = 0;
let score = 0;
let miss = 0;

/* 開始フラグ */
let started = false;

/* ノーツ */
const notes = [];

/* 曲最後まで自動生成 */
for(
let i = 1000;
i < 180000;
i += 450
){

notes.push({

time:i,

lane:
Math.floor(
Math.random() * 4
)

});

}

/* 開始 */
function startGame(){

if(started) return;

started = true;

/* ボタン消す */
document.querySelector(
".start-btn"
).style.display = "none";

/* 曲再生 */
music.play().catch(err=>{

alert(
"音楽エラー：" + err
);

});

/* ループ */
gameLoop();

}

/* ゲームループ */
function gameLoop(){

const currentTime =
music.currentTime * 1000;

/* ノーツ生成 */
notes.forEach(note=>{

if(
!note.spawned &&
currentTime >= note.time - 2200
){

createNote(note);

note.spawned = true;

}

});

/* 曲終了まで継続 */
if(!music.paused){

requestAnimationFrame(
gameLoop
);

}

}

/* ノーツ生成 */
function createNote(noteData){

const lane =
lanes[noteData.lane];

const note =
document.createElement("div");

note.classList.add("note");

note.dataset.hit = "false";

lane.appendChild(note);

/* 初期位置 */
let pos = -30;

/* 速度 */
const speed = 3;

/* 落下 */
const move = setInterval(()=>{

pos += speed;

note.style.top =
pos + "px";

/* 画面下 */
if(pos >= window.innerHeight){

if(
note.dataset.hit === "false"
){

miss++;

combo = 0;

comboText.innerText =
combo;

judgeText.innerText =
"MISS";

}

/* 削除 */
note.remove();

clearInterval(move);

}

},16);

/* 保存 */
note.move = move;

}

/* 判定 */
function hitNote(laneIndex){

const lane =
lanes[laneIndex];

const laneNotes =
lane.querySelectorAll(".note");

/* ノーツ無し */
if(laneNotes.length === 0){

judgeText.innerText =
"MISS";

combo = 0;

comboText.innerText =
combo;

return;

}

const note =
laneNotes[0];

const rect =
note.getBoundingClientRect();

/* 判定位置 */
const hitY =
window.innerHeight - 170;

/* 距離 */
const diff =
Math.abs(
rect.top - hitY
);

/* PERFECT */
if(diff < 80){

note.dataset.hit = "true";

clearInterval(
note.move
);

note.remove();

combo++;

score += 100;

/* 更新 */
comboText.innerText =
combo;

scoreText.innerText =
"Score : " + score;

judgeText.innerText =
"PERFECT ✨";

/* 演出 */
tapEffect(lane);

/* コンボ */
if(combo % 10 === 0){

judgeText.innerText =
combo +
" COMBO 🔥";

}

}else{

judgeText.innerText =
"BAD";

combo = 0;

comboText.innerText =
combo;

}

}

/* エフェクト */
function tapEffect(lane){

const effect =
document.createElement("div");

effect.classList.add(
"tap-effect"
);

lane.appendChild(effect);

setTimeout(()=>{

effect.remove();

},250);

}

/* スマホ操作 */
lanes.forEach(
(lane,index)=>{

lane.addEventListener(
"touchstart",
()=>{

hitNote(index);

}
);

}
);

/* PCキー */
document.addEventListener(
"keydown",
(e)=>{

if(e.key === "d"){
hitNote(0);
}

if(e.key === "f"){
hitNote(1);
}

if(e.key === "j"){
hitNote(2);
}

if(e.key === "k"){
hitNote(3);
}

}
);

/* 曲終了 */
music.addEventListener(
"ended",
()=>{

judgeText.innerText =
"🎉 LIVE CLEAR 🎉";

/* フルコン */
if(miss === 0){

fullcombo.style.display =
"block";

}

}
);

</script>

</body>
</html>
