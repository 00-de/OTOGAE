<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>DayDream Beats!! FINAL</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
user-select:none;
}

body{position:fixed;inset:0;}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:linear-gradient(to bottom,#5ed0ff,#001b38);
color:white;
}

.bg{
position:absolute;
width:100%;
height:100%;
background:url('bg.jpg') center/cover;
opacity:0.35;
}

/* ===== TOP UI ===== */
.top-ui{
position:absolute;
top:16px;
left:0;
width:100%;
padding:0 12px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:200;
}

/* 🎵曲名＋コンボ横並び */
.song-title-area{
font-size:15px;
font-weight:bold;
max-width:70%;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
text-shadow:0 0 10px black;
display:flex;
align-items:center;
gap:10px;
}

/* コンボ（曲名の横） */
#comboInline{
font-size:14px;
font-weight:bold;
color:#8ce8ff;
text-shadow:0 0 10px #8ce8ff;
opacity:0;
transition:0.15s;
}

.score{
font-size:15px;
font-weight:bold;
}

/* ===== BUTTON ===== */
.controls{
position:absolute;
top:50px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
width:95%;
justify-content:center;
z-index:200;
}

.control-btn{
padding:8px 14px;
border:none;
border-radius:14px;
background:white;
color:#222;
font-size:12px;
font-weight:bold;
box-shadow:0 0 10px white;
}

/* ===== MODE ===== */
.mode-area{
position:absolute;
top:92px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:8px;
width:95%;
justify-content:center;
z-index:200;
}

.mode-btn{
padding:8px 14px;
border:none;
border-radius:14px;
background:#ffffffdd;
font-size:12px;
}

/* ===== JUDGE ===== */
#judge{
position:absolute;
top:132px;
left:50%;
transform:translateX(-50%);
font-size:22px;
font-weight:bold;
z-index:200;
}

/* ===== LANE ===== */
.lanes{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:98%;
max-width:700px;
height:100%;
display:flex;
}

.lane{
flex:1;
position:relative;
border-left:2px solid rgba(255,255,255,0.12);
border-right:2px solid rgba(255,255,255,0.12);
}

/* 🔥判定ライン（精度改善済み） */
.hit-line{
position:absolute;
bottom:18%;
width:100%;
height:8px;
background:white;
box-shadow:0 0 20px white,0 0 40px white;
}

/* NOTE */
.note{
position:absolute;
width:88%;
height:30px;
left:6%;
border-radius:18px;
background:linear-gradient(90deg,#fff,#8ce8ff);
box-shadow:0 0 15px #8ce8ff,0 0 35px #8ce8ff;
}

/* START */
.start-menu{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
z-index:400;
}

.menu-btn{
padding:20px 35px;
font-size:22px;
font-weight:bold;
border:none;
border-radius:20px;
background:white;
color:#333;
box-shadow:0 0 25px white;
}

/* RESULT */
#resultScreen{
position:absolute;
inset:0;
background:rgba(0,0,0,0.88);
display:none;
justify-content:center;
align-items:center;
z-index:500;
}

.result-box{
background:rgba(255,255,255,0.1);
padding:30px;
border-radius:25px;
text-align:center;
width:85%;
max-width:400px;
backdrop-filter:blur(10px);
}

.result-title{font-size:34px;margin-bottom:20px;}
.result-score{font-size:22px;margin:10px 0;}
.result-rank{font-size:42px;margin-top:20px;text-shadow:0 0 20px gold;}

/* BEST */
#ranking{
position:absolute;
left:50%;
bottom:78px;
transform:translateX(-50%);
width:92%;
background:rgba(0,0,0,0.45);
padding:6px;
border-radius:14px;
font-size:11px;
text-align:center;
z-index:300;
}

</style>
</head>

<body>

<div id="game">
<div class="bg"></div>

<div class="top-ui">

  <div class="song-title-area">
    🎵 風になる合図 / 蓮
    <span id="comboInline"></span>
  </div>

  <div class="score" id="score">Score : 0</div>

</div>

<div class="controls">
<button onclick="pauseGame()">⏸ 一時停止</button>
<button onclick="resetGame()">🔄 リセット</button>
</div>

<div class="mode-area">
<button onclick="setEasyMode()">🌟 初級</button>
<button onclick="setHardMode()">🔥 上級</button>
</div>

<div id="judge">READY</div>

<div id="ranking">🏆 TODAY BEST : 0</div>

<div class="start-menu">
<button onclick="restartGame()">▶ START</button>
<button onclick="setHardMode()">🔥 HARD</button>
</div>

<div id="resultScreen">
<div class="result-box">
<div class="result-title">🎉 GAME CLEAR</div>
<div id="resultScore" class="result-score">SCORE : 0</div>
<div id="resultRate" class="result-score">成功率 : 0%</div>
<div id="resultCombo" class="result-score">MAX COMBO : 0</div>
<div id="resultRank" class="result-rank">RANK C</div>
</div>
</div>

<div class="lanes">
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
<div class="lane"></div>
</div>

</div>

<audio id="music" src="kaze.mp3"></audio>

<script>

const music=document.getElementById("music");
const comboInline=document.getElementById("comboInline");
const judgeText=document.getElementById("judge");
const scoreText=document.getElementById("score");
const rankingText=document.getElementById("ranking");

const resultScreen=document.getElementById("resultScreen");
const resultScore=document.getElementById("resultScore");
const resultRate=document.getElementById("resultRate");
const resultCombo=document.getElementById("resultCombo");
const resultRank=document.getElementById("resultRank");

const lanes=document.querySelectorAll(".lane");

let combo=0,maxCombo=0,score=0,miss=0;
let paused=false;
let noteSpeed=3,noteInterval=450;
let notes=[];

let todayBest=localStorage.getItem("todayBest")||0;
rankingText.innerHTML="🏆 TODAY BEST : "+todayBest;

/* コンボ表示（曲名横） */
function showCombo(b){
if(combo<2){
comboInline.style.opacity="0";
comboInline.innerHTML="";
return;
}

comboInline.style.opacity="1";
comboInline.innerHTML=`🔥 ${combo} x${b}`;
}

/* ノーツ */
function generateNotes(){
notes=[];
const len=music.duration*1000;
for(let i=1000;i<len;i+=noteInterval){
notes.push({time:i,lane:Math.floor(Math.random()*4)});
}
}

/* START */
function restartGame(){
music.pause();
music.currentTime=0;

document.querySelectorAll(".note").forEach(n=>{
clearInterval(n.move);n.remove();
});

combo=0;maxCombo=0;score=0;miss=0;
scoreText.innerText="Score : 0";
comboInline.style.opacity="0";
resultScreen.style.display="none";

document.querySelector(".start-menu").style.display="none";

generateNotes();
music.play();
gameLoop();
}

/* LOOP */
function gameLoop(){
if(paused)return;

const t=music.currentTime*1000;

notes.forEach(n=>{
if(!n.spawned&&t>=n.time-2200){
createNote(n);n.spawned=true;
}
});

if(!music.paused)requestAnimationFrame(gameLoop);
}

/* CREATE */
function createNote(d){
const lane=lanes[d.lane];
const note=document.createElement("div");
note.className="note";
lane.appendChild(note);

let pos=-30;

const move=setInterval(()=>{
if(paused)return;

pos+=noteSpeed;
note.style.top=pos+"px";

if(pos>=innerHeight){
miss++;combo=0;
judgeText.innerText="MISS ❌";
note.remove();
clearInterval(move);
}
},16);

note.move=move;
}

/* HIT（完全バランス版） */
function hitNote(i){
if(paused)return;

const lane=lanes[i];
const list=lane.querySelectorAll(".note");

if(!list.length){
combo=0;
judgeText.innerText="MISS ❌";
return;
}

const note=list[0];
const r=note.getBoundingClientRect();

const hit=innerHeight*0.82;
const center=r.top+r.height/2;

const a=Math.abs(center-hit);

/* 判定 */
let add=0;

if(a<=10){add=500;judgeText.innerText="PERFECT+ 🌈";}
else if(a<=30){add=350;judgeText.innerText="PERFECT ✨";}
else if(a<=60){add=200;judgeText.innerText="GREAT 🔥";}
else if(a<=100){add=120;judgeText.innerText="GOOD 👍";}
else{combo=0;judgeText.innerText="MISS ❌";return;}

/* コンボ倍率 */
let bonus=1;
if(combo>=100)bonus=12;
else if(combo>=80)bonus=9;
else if(combo>=60)bonus=7;
else if(combo>=40)bonus=5;
else if(combo>=25)bonus=3;
else if(combo>=10)bonus=2;

/* 成長係数 */
const factor=1+(combo*0.03);

combo++;
maxCombo=Math.max(maxCombo,combo);

score+=Math.floor(add*bonus*factor);

scoreText.innerText="Score : "+score;

showCombo(bonus);

clearInterval(note.move);
note.remove();
}

/* CONTROL */
function pauseGame(){
if(!paused){
music.pause();paused=true;judgeText.innerText="PAUSE";
}else{
music.play();paused=false;gameLoop();judgeText.innerText="RESUME";
}
}

function resetGame(){restartGame();}
function setEasyMode(){noteSpeed=2;noteInterval=650;restartGame();}
function setHardMode(){noteSpeed=5;noteInterval=300;restartGame();}

/* INPUT */
lanes.forEach((l,i)=>{
l.addEventListener("touchstart",e=>{e.preventDefault();hitNote(i);},{passive:false});
l.addEventListener("click",()=>hitNote(i));
});

document.addEventListener("keydown",e=>{
if(e.key==="d")hitNote(0);
if(e.key==="f")hitNote(1);
if(e.key==="j")hitNote(2);
if(e.key==="k")hitNote(3);
});

/* END */
music.addEventListener("ended",()=>{
const total=notes.length;
const hit=total-miss;
const rate=Math.floor((hit/total)*100);

let rank="C";
if(rate>=100)rank="SSS 👑";
else if(rate>=95)rank="SS 🌟";
else if(rate>=90)rank="S 🔥";
else if(rate>=80)rank="A ✨";
else if(rate>=70)rank="B 👍";

if(score>todayBest){
todayBest=score;
localStorage.setItem("todayBest",todayBest);
rankingText.innerHTML="🏆 TODAY BEST : "+todayBest;
}

resultScreen.style.display="flex";
resultScore.innerText="SCORE : "+score;
resultRate.innerText="成功率 : "+rate+"%";
resultCombo.innerText="MAX COMBO : "+maxCombo;
resultRank.innerText=rank;
});

</script>

</body>
</html>
