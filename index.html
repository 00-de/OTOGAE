<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
minimum-scale=1.0,
user-scalable=no,
viewport-fit=cover
">

<title>DayDream Beats!! ULTIMATE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;

touch-action:manipulation;
overscroll-behavior:none;

-webkit-user-select:none;
user-select:none;
}

body{
position:fixed;
inset:0;
}

/* ゲーム */
#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;

background:
linear-gradient(
to bottom,
#58c6ff,
#001d3d
);

color:white;
}

/* 背景 */
.bg{
position:absolute;
width:100%;
height:100%;

background:
url('bg.jpg')
center/cover;

opacity:0.35;
}

/* 🌟 コンボ */
#combo{

position:absolute;

top:8px;

left:50%;

transform:translateX(-50%);

line-height:1.0;

text-align:center;

z-index:150;

display:block;

min-width:180px;

pointer-events:none;

opacity:0;
}

/* 🌟 UI */
.top-ui{
position:absolute;

top:50px;

left:0;

width:100%;

padding:0 15px;

display:flex;
justify-content:space-between;
align-items:center;

z-index:100;
}

.song-title{

font-size:16px;
font-weight:bold;

white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;

max-width:60%;

text-shadow:
0 0 10px black;
}

.score{
font-size:16px;
font-weight:bold;
}

/* 🌟 ボタン */
.controls{

position:absolute;

top:88px;

left:50%;

transform:translateX(-50%);

display:flex;
flex-wrap:wrap;

justify-content:center;

gap:6px;

width:96%;

z-index:100;
}

.control-btn{

padding:7px 12px;

border:none;
border-radius:12px;

background:white;
color:#222;

font-size:12px;
font-weight:bold;

box-shadow:
0 0 10px white;
}

/* 🌟 難易度 */
.mode-area{

position:absolute;

top:132px;

left:50%;

transform:translateX(-50%);

display:flex;
flex-wrap:wrap;

justify-content:center;

gap:6px;

width:96%;

z-index:100;
}

.mode-btn{

padding:7px 12px;

border:none;
border-radius:12px;

background:#ffffffcc;

font-size:12px;
font-weight:bold;
}

/* 🌟 判定 */
#judge{
position:absolute;

top:190px;
left:50%;

transform:translateX(-50%);

font-size:24px;
font-weight:bold;

z-index:100;

text-align:center;

text-shadow:
0 0 15px white;
}

/* ランキング */
#ranking{

position:absolute;

left:50%;
bottom:8px;

transform:translateX(-50%);

width:94%;
max-width:700px;

background:
rgba(0,0,0,0.55);

padding:8px;

border-radius:15px;

font-size:11px;

z-index:200;

line-height:1.6;

text-align:center;

backdrop-filter:blur(8px);
}

/* 🌟 レーン */
.lanes{
position:absolute;

bottom:55px;

left:50%;

transform:translateX(-50%);

width:98%;
max-width:700px;

height:100%;

display:flex;
}

/* レーン */
.lane{
flex:1;
position:relative;

border-left:
2px solid rgba(255,255,255,0.12);

border-right:
2px solid rgba(255,255,255,0.12);
}

/* 🌟 判定ライン */
.hit-line{
position:absolute;

bottom:90px;

width:100%;
height:8px;

background:white;

box-shadow:
0 0 20px white,
0 0 40px white;
}

/* 🌟 ノーツ */
.note{
position:absolute;

width:88%;
height:30px;

left:6%;

border-radius:18px;

background:
linear-gradient(
90deg,
#ffffff,
#8ce8ff
);

box-shadow:
0 0 15px #8ce8ff,
0 0 35px #8ce8ff;
}

/* タップ演出 */
.tap-effect{
position:absolute;

bottom:70px;

width:100%;
height:60px;

background:
rgba(255,255,255,0.5);

animation:flash 0.25s;
}

@keyframes flash{

0%{
opacity:1;
transform:scaleY(1);
}

100%{
opacity:0;
transform:scaleY(2);
}

}

/* スタート */
.start-menu{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

display:flex;
flex-direction:column;

gap:15px;

z-index:300;
}

.menu-btn{

padding:20px 35px;

font-size:22px;
font-weight:bold;

border:none;
border-radius:20px;

background:white;
color:#333;

box-shadow:
0 0 25px white;
}

/* RESULT */
#resultScreen{

position:absolute;

inset:0;

background:
rgba(0,0,0,0.85);

display:none;

justify-content:center;
align-items:center;

z-index:500;
}

.result-box{

background:
rgba(255,255,255,0.1);

padding:30px;

border-radius:25px;

text-align:center;

width:85%;
max-width:400px;

backdrop-filter:blur(10px);

box-shadow:
0 0 30px rgba(255,255,255,0.2);
}

.result-title{

font-size:34px;
font-weight:bold;

margin-bottom:20px;
}

.result-score{

font-size:22px;

margin:10px 0;
}

.result-rank{

font-size:42px;
font-weight:bold;

margin-top:20px;

text-shadow:
0 0 20px gold;
}

/* スマホ */
@media(max-width:600px){

.song-title{
font-size:14px;
max-width:55%;
}

.score{
font-size:14px;
}

#judge{
font-size:20px;
top:190px;
}

}

</style>
</head>

<body>

<div id="game">

<div class="bg"></div>

<!-- 🌟 コンボ -->
<div id="combo"></div>

<!-- UI -->
<div class="top-ui">

<div class="song-title">
🎵 風になる合図 / 蓮
</div>

<div class="score"
id="score">
Score : 0
</div>

</div>

<!-- ボタン -->
<div class="controls">

<button class="control-btn"
onclick="pauseGame()">
⏸ 一時停止
</button>

<button class="control-btn"
onclick="resetScore()">
🔄 リセット
</button>

</div>

<!-- 難易度 -->
<div class="mode-area">

<button class="mode-btn"
onclick="setEasyMode()">
🌟 初級
</button>

<button class="mode-btn"
onclick="setHardMode()">
🔥 上級
</button>

</div>

<!-- 判定 -->
<div id="judge">
READY
</div>

<!-- ランキング -->
<div id="ranking">
🏆 TODAY BEST
</div>

<!-- START -->
<div class="start-menu">

<button class="menu-btn"
onclick="restartGame()">
▶ 再生してスタート
</button>

</div>

<!-- RESULT -->
<div id="resultScreen">

<div class="result-box">

<div class="result-title">
🎉 ゲーム終了
</div>

<div class="result-score"
id="resultScore">
SCORE : 0
</div>

<div class="result-score"
id="resultRate">
成功率 : 0%
</div>

<div class="result-score"
id="resultCombo">
MAX COMBO : 0
</div>

<div class="result-rank"
id="resultRank">
RANK C
</div>

</div>

</div>

<!-- レーン -->
<div class="lanes">

<div class="lane" data-lane="0">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="1">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="2">
<div class="hit-line"></div>
</div>

<div class="lane" data-lane="3">
<div class="hit-line"></div>
</div>

</div>

</div>

<audio id="music"
src="kaze.mp3">
</audio>

<script>

document.addEventListener(
"dblclick",
e=>e.preventDefault(),
{ passive:false }
);

const music =
document.getElementById("music");

const comboText =
document.getElementById("combo");

const judgeText =
document.getElementById("judge");

const scoreText =
document.getElementById("score");

const resultScreen =
document.getElementById("resultScreen");

const resultScore =
document.getElementById("resultScore");

const resultRate =
document.getElementById("resultRate");

const resultCombo =
document.getElementById("resultCombo");

const resultRank =
document.getElementById("resultRank");

const lanes =
document.querySelectorAll(".lane");

let combo = 0;
let maxCombo = 0;
let score = 0;
let miss = 0;

let started = false;
let paused = false;

let noteSpeed = 3;
let noteInterval = 450;

let notes = [];

/* 🌟 コンボ演出 */
function showComboEffect(comboBonus){

if(combo < 2){

comboText.style.opacity =
"0";

return;

}

comboText.style.opacity =
"1";

comboText.innerHTML =

`
<div style="
font-size:40px;
font-weight:bold;
line-height:1;
">
${combo}
</div>

<div style="
font-size:15px;
margin-top:4px;
letter-spacing:2px;
">
COMBO x${comboBonus}
</div>
`;

if(combo >= 100){

comboText.style.color =
"#ff4dff";

comboText.style.textShadow =
`
0 0 20px #ff4dff,
0 0 40px #00ffff,
0 0 60px gold
`;

}else if(combo >= 50){

comboText.style.color =
"gold";

comboText.style.textShadow =
`
0 0 20px gold,
0 0 40px orange
`;

}else{

comboText.style.color =
"white";

comboText.style.textShadow =
`
0 0 10px white,
0 0 20px #8ce8ff,
0 0 40px #8ce8ff
`;

}

comboText.animate(

[
{
transform:
"translateX(-50%) scale(0.7)",
opacity:0.5
},
{
transform:
"translateX(-50%) scale(1.12)",
opacity:1
},
{
transform:
"translateX(-50%) scale(1)",
opacity:1
}
],

{
duration:180
}

);

}

/* 譜面 */
function generateNotes(){

notes = [];

const songLength =
music.duration * 1000;

for(
let i = 1000;
i < songLength;
i += noteInterval
){

notes.push({

time:i,

lane:
Math.floor(
Math.random() * 4
)

});

}

}

/* 再スタート */
function restartGame(){

music.pause();

music.currentTime = 0;

document.querySelectorAll(".note")
.forEach(note=>{

clearInterval(note.move);

note.remove();

});

score = 0;
combo = 0;
maxCombo = 0;
miss = 0;

scoreText.innerText =
"Score : 0";

comboText.style.opacity =
"0";

judgeText.innerText =
"START!! 🎵";

resultScreen.style.display =
"none";

startGame();

}

/* 開始 */
function startGame(){

started = true;

document.querySelector(
".start-menu"
).style.display = "none";

generateNotes();

music.play();

gameLoop();

}

/* ループ */
function gameLoop(){

if(paused) return;

const currentTime =
music.currentTime * 1000;

notes.forEach(note=>{

if(
!note.spawned &&
currentTime >= note.time - 2200
){

createNote(note);

note.spawned = true;

}

});

if(!music.paused){

requestAnimationFrame(
gameLoop
);

}

}

/* ノーツ */
function createNote(noteData){

const lane =
lanes[noteData.lane];

const note =
document.createElement("div");

note.classList.add("note");

lane.appendChild(note);

let pos = -30;

const move = setInterval(()=>{

if(paused) return;

pos += noteSpeed;

note.style.top =
pos + "px";

if(pos >= window.innerHeight){

miss++;

combo = 0;

comboText.style.opacity =
"0";

judgeText.innerText =
"MISS ❌";

note.remove();

clearInterval(move);

}

},16);

note.move = move;

}

/* 🌟 判定 */
function hitNote(laneIndex){

if(paused) return;

const lane =
lanes[laneIndex];

const laneNotes =
lane.querySelectorAll(".note");

if(laneNotes.length === 0){

combo = 0;

comboText.style.opacity =
"0";

judgeText.innerText =
"MISS ❌";

return;

}

const note =
laneNotes[0];

const rect =
note.getBoundingClientRect();

const hitY =
window.innerHeight - 170;

/* 🌟 精度 */
const noteCenter =
rect.top + (rect.height / 2);

const perfectCenter =
hitY;

const accuracy =
Math.abs(
noteCenter - perfectCenter
);

let addScore = 0;

/* PERFECT+ */
if(accuracy <= 10){

judgeText.innerText =
"🌈 PERFECT+ 🌈";

addScore = 500;

navigator.vibrate?.(30);

document.body.style.filter =
"brightness(1.15)";

setTimeout(()=>{

document.body.style.filter =
"brightness(1)";

},80);

}

/* PERFECT */
else if(accuracy <= 30){

judgeText.innerText =
"PERFECT ✨";

addScore = 300;

}

/* GREAT */
else if(accuracy <= 60){

judgeText.innerText =
"GREAT 🔥";

addScore = 200;

}

/* GOOD */
else if(accuracy <= 100){

judgeText.innerText =
"GOOD 👍";

addScore = 100;

}

/* MISS */
else{

judgeText.innerText =
"MISS ❌";

combo = 0;

comboText.style.opacity =
"0";

return;

}

/* 🌟 コンボ倍率 */
let comboBonus = 1;

if(combo >= 10) comboBonus = 2;
if(combo >= 20) comboBonus = 3;
if(combo >= 30) comboBonus = 4;
if(combo >= 40) comboBonus = 5;
if(combo >= 50) comboBonus = 6;
if(combo >= 60) comboBonus = 7;
if(combo >= 70) comboBonus = 8;
if(combo >= 80) comboBonus = 9;
if(combo >= 90) comboBonus = 10;

if(combo >= 100){

comboBonus = 15;

judgeText.innerText =
"🌈 GOD COMBO 🌈";

}

/* 🌟 コンボ加算 */
combo++;

if(combo > maxCombo){

maxCombo = combo;

}

/* 🌟 スコア */
score +=
addScore * comboBonus;

scoreText.innerText =
"Score : " + score;

/* 🌟 コンボ表示 */
showComboEffect(comboBonus);

/* ノーツ削除 */
clearInterval(note.move);

note.remove();

/* エフェクト */
tapEffect(lane);

}

/* エフェクト */
function tapEffect(lane){

const effect =
document.createElement("div");

effect.classList.add(
"tap-effect"
);

lane.appendChild(effect);

setTimeout(()=>{

effect.remove();

},250);

}

/* 一時停止 */
function pauseGame(){

if(!started) return;

if(!paused){

music.pause();

paused = true;

judgeText.innerText =
"⏸ PAUSE";

}else{

music.play();

paused = false;

gameLoop();

judgeText.innerText =
"▶ RESUME";

}

}

/* リセット */
function resetScore(){

score = 0;
combo = 0;
maxCombo = 0;
miss = 0;

scoreText.innerText =
"Score : 0";

comboText.style.opacity =
"0";

}

/* 難易度 */
function setEasyMode(){

noteSpeed = 2;
noteInterval = 650;

restartGame();

}

function setHardMode(){

noteSpeed = 5;
noteInterval = 300;

restartGame();

}

/* タップ */
lanes.forEach(
(lane,index)=>{

lane.addEventListener(
"touchstart",
(e)=>{

e.preventDefault();

hitNote(index);

},
{ passive:false }
);

}
);

/* PC */
document.addEventListener(
"keydown",
(e)=>{

if(e.key==="d") hitNote(0);
if(e.key==="f") hitNote(1);
if(e.key==="j") hitNote(2);
if(e.key==="k") hitNote(3);

}
);

/* 曲終了 */
music.addEventListener(
"ended",
()=>{

const totalNotes =
notes.length;

const hitNotes =
totalNotes - miss;

const successRate =
Math.floor(
(hitNotes / totalNotes) * 100
);

let rank = "C";

if(successRate >= 100){

rank = "SSS 👑";

}else if(successRate >= 95){

rank = "SS 🌟";

}else if(successRate >= 90){

rank = "S 🔥";

}else if(successRate >= 80){

rank = "A ✨";

}else if(successRate >= 70){

rank = "B 👍";

}

resultScreen.style.display =
"flex";

resultScore.innerText =
"SCORE : " + score;

resultRate.innerText =
"成功率 : " + successRate + "%";

resultCombo.innerText =
"MAX COMBO : " + maxCombo;

resultRank.innerText =
rank;

}
);

</script>

</body>
</html>
