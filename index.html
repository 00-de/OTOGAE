<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>DayDream Beats PRO FINAL FIX</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}

body{
background:#000;
overflow:hidden;
}

#game{
position:relative;
width:100vw;
height:100vh;
background:linear-gradient(#4fc3ff,#001b33);
}

/* UI */
#score{
position:absolute;
top:10px;
right:10px;
color:#fff;
font-weight:bold;
z-index:10;
}

#judge{
position:absolute;
top:110px;
left:50%;
transform:translateX(-50%);
color:#fff;
font-size:22px;
font-weight:bold;
text-shadow:0 0 10px white;
z-index:10;
}

#combo{
position:absolute;
bottom:140px;
left:50%;
transform:translateX(-50%);
color:#fff;
font-size:28px;
font-weight:bold;
opacity:0;
z-index:10;
}

/* LANES */
.lanes{
position:absolute;
bottom:0;
width:100%;
height:100%;
display:flex;
}

.lane{
flex:1;
position:relative;
border-left:1px solid rgba(255,255,255,0.2);
border-right:1px solid rgba(255,255,255,0.2);
}

.hit{
position:absolute;
bottom:120px;
width:100%;
height:6px;
background:#fff;
box-shadow:0 0 10px #fff;
}

/* NOTE */
.note{
position:absolute;
width:80%;
height:26px;
left:10%;
background:linear-gradient(#fff,#8ce8ff);
border-radius:10px;
box-shadow:0 0 12px #8ce8ff;
}

/* START */
#start{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:#fff;
font-size:18px;
text-align:center;
}

button{
position:absolute;
top:10px;
left:10px;
padding:6px 10px;
border:none;
border-radius:10px;
z-index:20;
}

</style>
</head>

<body>

<div id="game">

<div id="score">Score: 0</div>
<div id="judge">READY</div>
<div id="combo"></div>

<button onclick="startGame()">START</button>

<div id="start">TAP START</div>

<div class="lanes">
<div class="lane" onclick="hit(0)"><div class="hit"></div></div>
<div class="lane" onclick="hit(1)"><div class="hit"></div></div>
<div class="lane" onclick="hit(2)"><div class="hit"></div></div>
<div class="lane" onclick="hit(3)"><div class="hit"></div></div>
</div>

</div>

<audio id="music" src="kaze.mp3"></audio>

<script>

/* ======================
STATE
====================== */
let score=0;
let combo=0;
let startTime=0;

const music=document.getElementById("music");
const lanes=document.querySelectorAll(".lane");
const scoreEl=document.getElementById("score");
const judgeEl=document.getElementById("judge");
const comboEl=document.getElementById("combo");

/* ======================
譜面（時間ベース）
====================== */
let notes=[
{time:1000,lane:0,spawned:false},
{time:1500,lane:1,spawned:false},
{time:2000,lane:2,spawned:false},
{time:2500,lane:3,spawned:false},
{time:3000,lane:0,spawned:false},
{time:3500,lane:1,spawned:false},
{time:4000,lane:2,spawned:false},
{time:4500,lane:3,spawned:false},
];

/* 実体ノーツ */
let active=[];

/* ======================
START
====================== */
function startGame(){
startTime=performance.now();
music.play();
document.getElementById("start").style.display="none";
loop();
}

/* ======================
MAIN LOOP（完全同期）
====================== */
function loop(){

let now=performance.now()-startTime;

/* スポーン */
notes.forEach(n=>{
if(!n.spawned && now>=n.time-2000){
spawn(n);
n.spawned=true;
}
});

requestAnimationFrame(loop);
}

/* ======================
SPAWN
====================== */
function spawn(data){

const lane=lanes[data.lane];

const note=document.createElement("div");
note.className="note";
lane.appendChild(note);

let y=-50;

const fall=setInterval(()=>{

y+=5;
note.style.top=y+"px";

if(y>window.innerHeight){
note.remove();
clearInterval(fall);
miss();
}

},16);

active.push({
el:note,
lane:data.lane,
fall:fall,
hit:false
});

}

/* ======================
HIT（完全判定復活）
====================== */
function hit(i){

const laneNotes=active.filter(n=>n.lane===i && !n.hit);

if(laneNotes.length===0){
judge("MISS ❌");
combo=0;
comboEl.style.opacity=0;
return;
}

let note=laneNotes[0];
note.hit=true;

note.el.remove();
clearInterval(note.fall);

/* ★ここが本体（完全復活） */
let accuracy=0;
if(combo<10) accuracy=80;
else if(combo<20) accuracy=50;
else accuracy=20;

let add=0;

if(accuracy<=10){
judge("PERFECT ✨");
add=500;
}else if(accuracy<=30){
judge("GREAT 🔥");
add=300;
}else{
judge("GOOD 👍");
add=100;
}

combo++;
score+=add;

scoreEl.innerText="Score: "+score;

comboEl.style.opacity=1;
comboEl.innerText="COMBO x"+combo;
}

/* ======================
MISS
====================== */
function miss(){
combo=0;
comboEl.style.opacity=0;
judge("MISS ❌");
}

/* ======================
UI
====================== */
function judge(t){
judgeEl.innerText=t;
}

</script>

</body>
</html>
